services:
  postgres:
    image: postgres
    restart: always
    volumes:
      - kite-local-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kite
      PGUSER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 3s
      timeout: 30s
      retries: 3

  # S3 compatible file storage. SeaweedFS replaces MinIO, whose community
  # images are no longer published. The account is defined in
  # docker/seaweedfs-s3.json, without it the storage would not ask for a login.
  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=256
    restart: always
    ports:
      # Only for tools on this machine; the kite service reaches it as s3:9000.
      - "127.0.0.1:9000:9000"
    volumes:
      - kite-local-s3:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  kite:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the embedded frontend so the browser knows the AI service URL.
        NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:3008
        # Build label shown under the app name; override in .env. Defaults to
        # "Stable build" here; unset entirely it would show "Developer build".
        NEXT_PUBLIC_BUILD_LABEL: ${NEXT_PUBLIC_BUILD_LABEL:-Stable build}
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - KITE_API__HOST=0.0.0.0
      - KITE_DATABASE__POSTGRES__HOST=postgres
      - KITE_DATABASE__POSTGRES__USER=postgres
      - KITE_DATABASE__POSTGRES__DB_NAME=kite
      - KITE_DATABASE__S3__ENDPOINT=s3:9000
      - KITE_DATABASE__S3__ACCESS_KEY_ID=kite
      - KITE_DATABASE__S3__SECRET_ACCESS_KEY=1234567890
      - KITE_DATABASE__S3__SECURE=false
      - KITE_API__PUBLIC_BASE_URL=http://localhost:8080
      - KITE_API__WEBHOOK_BASE_URL=http://localhost:3002
      - KITE_API__INTERNAL_SECRET=${INTERNAL_SECRET}
    volumes:
      - ./kite.toml:/root/kite.toml
    depends_on:
      postgres:
        condition: service_healthy

  kite-webhook:
    build:
      context: ./kite-webhook
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - KITE_SERVICE_INTERNAL_URL=http://kite:8080
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    depends_on:
      - kite

  ai-service:
    build:
      context: ./kite-ai-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3008:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      # Internal Docker network name of the Go API.
      - KITE_API_BASE_URL=http://kite:8080
      # Browser origin allowed to call this service (with credentials).
      - WEB_ORIGIN=http://localhost:8080
      # AI models are fetched from the Go service (GET /v1/internal/ai/models),
      # authenticated with the shared internal secret.
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      # kite.toml [ai] is only a fallback while the Go service is unreachable.
      - KITE_CONFIG_PATH=/app/kite.toml
      # AI_GATEWAY_API_KEY comes from .env (Vercel AI Gateway key).
    volumes:
      - ./kite.toml:/app/kite.toml:ro
    depends_on:
      - kite

  docs:
    # Prebuilt on Docker Hub with APP_BASE_URL=https://bot.vibehost.vn baked in.
    # To use another domain, build it yourself: docker build --build-arg APP_BASE_URL=<url> ./kite-docs
    image: chisadin/vibebot-docs:latest
    restart: always
    ports:
      - "4000:80"

volumes:
  kite-local-postgres:
  kite-local-s3:
