services:
  postgres:
    image: postgres
    restart: always
    volumes:
      - kite-local-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kite
      PGUSER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 3s
      timeout: 30s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - kite-local-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 30s
      retries: 3

  minio:
    image: quay.io/minio/minio
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: kite
      MINIO_ROOT_PASSWORD: 1234567890
    volumes:
      - kite-local-minio:/data

  kite:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - KITE_API__HOST=0.0.0.0
      - KITE_DATABASE__POSTGRES__HOST=postgres
      - KITE_DATABASE__POSTGRES__USER=postgres
      - KITE_DATABASE__POSTGRES__DB_NAME=kite
      - KITE_DATABASE__S3__ENDPOINT=minio:9000
      - KITE_DATABASE__S3__ACCESS_KEY_ID=kite
      - KITE_DATABASE__S3__SECRET_ACCESS_KEY=1234567890
      - KITE_DATABASE__S3__SECURE=false
      - KITE_APP__PUBLIC_BASE_URL=http://localhost:3000
      - KITE_API__PUBLIC_BASE_URL=http://localhost:8080
    volumes:
      - ./kite.toml:/root/kite.toml
    depends_on:
      postgres:
        condition: service_healthy

  docs:
    build:
      context: ./kite-docs
      dockerfile: Dockerfile
      args:
        # Domain the docs embeds/schema fetch from. Bound to .env so switching
        # to a real domain only requires editing KITE_APP__PUBLIC_BASE_URL there.
        APP_BASE_URL: ${KITE_APP__PUBLIC_BASE_URL}
    restart: always
    ports:
      - "4000:80"

  admin-service:
    build:
      context: ./kite-admin-service
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${ADMIN_SERVICE_PORT}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${ADMIN_DATABASE_URL}
      - REDIS_URL=${ADMIN_REDIS_URL}
      - JWT_SECRET=${ADMIN_JWT_SECRET}
    volumes:
      - kite-admin-data:/app/.data
      - ./kite-admin-service/users.json:/app/users.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-console:
    build:
      context: ./kite-admin-console
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${ADMIN_CONSOLE_API_URL}
    restart: always
    ports:
      - "${ADMIN_CONSOLE_PORT}:8080"
    depends_on:
      - admin-service

volumes:
  kite-local-postgres:
  kite-local-minio:
  kite-local-redis:
  kite-admin-data:
