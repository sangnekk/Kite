server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docusaurus emits static .html files; resolve clean URLs by also trying the
    # ".html" file and the directory's index before giving up.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
